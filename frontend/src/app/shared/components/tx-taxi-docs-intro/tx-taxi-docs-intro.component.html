<section class="taxi-docs-intro" aria-label="About tx.taxi" i18n-aria-label="@@tx-taxi.doge.intro.aria">
  <div class="taxi-docs-art" aria-hidden="true"></div>
  <div class="taxi-docs-copy">
    <p class="taxi-docs-eyebrow">tx.taxi <span aria-hidden="true">/</span> {{ chainName }} <span *ngIf="context === 'documentation'" i18n="@@tx-taxi.doge.intro.documentation">documentation</span><span *ngIf="context !== 'documentation'" i18n="@@tx-taxi.doge.intro.explorer">explorer</span></p>
    <h2 i18n="@@tx-taxi.doge.about.9">One search across chains.</h2>
    <p i18n="@@tx-taxi.doge.about.10">Paste a transaction, block or address into tx.taxi. Open a confirmed match, choose between possible networks, or head straight to your chain’s explorer.</p>
    <div class="taxi-docs-actions">
      <a class="taxi-docs-button" [href]="hubUrl"><span i18n="@@tx-taxi.doge.about.11">Open tx.taxi</span> <span aria-hidden="true">↗︎</span></a>
      <a class="taxi-docs-native" href="./" ><span i18n="@@tx-taxi.doge.intro.open-native">Explore {{ chainName }}</span> <span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
