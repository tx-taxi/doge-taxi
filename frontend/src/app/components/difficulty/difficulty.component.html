<div *ngIf="showTitle" class="main-title">Scrypt Mining</div>
<div class="card-wrapper"><div class="card"><div class="widget-toggler"><a href="" (click)="mode='network'; $event.preventDefault()" class="toggler-option" [ngClass]="{inactive:mode==='network'}"><small>network</small></a><span style="color:var(--transparent-fg)"> | </span><a href="" (click)="mode='rewards'; $event.preventDefault()" class="toggler-option" [ngClass]="{inactive:mode==='rewards'}"><small>rewards</small></a></div>
<div class="card-body more-padding"><div class="difficulty-adjustment-container" *ngIf="blocks$ | async as blocks"><div class="difficulty-stats" *ngIf="mode==='network'; else rewards"><div class="item"><div class="card-text">60 seconds</div><div class="symbol">Target block time</div></div><div class="item"><div class="card-text">{{blocks[0]?.difficulty | number:'1.0-0'}}</div><div class="symbol">Difficulty</div></div><div class="item"><div class="card-text">AuxPoW</div><div class="symbol">Merged mining</div></div></div><ng-template #rewards><div class="difficulty-stats"><div class="item"><div class="card-text">10,000 DOGE</div><div class="symbol">Block subsidy</div></div><div class="item"><div class="card-text">No halving</div><div class="symbol">Continuous issuance</div></div></div></ng-template></div></div></div></div>
